name: E-Commerce Automation Tests
 
on:
  push:
    branches: [ main, master ]
 
  pull_request:
    branches: [ main, master ]
 
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  automation-tests:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium
 
      - name: Create reports folder
        run: mkdir -p reports
 
      - name: Check website accessibility
        run: |
          echo "Checking website response..."
 
          curl -sS -L -D headers.txt -o response.html \
            -w "HTTP Status: %{http_code}\n" \
            https://automationexercise.com/
 
          echo "Response headers:"
          cat headers.txt
 
          echo "Response preview:"
          head -c 1000 response.html
 
      - name: Execute UI and API tests
        run: |
          pytest tests -v -s \
            --html=reports/automation_report.html \
            --self-contained-html
 
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-results
          path: |
            reports/
            screenshots/